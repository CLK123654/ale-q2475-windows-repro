apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: payment-ledger-dual-ipv6
  namespace: payments
  labels:
    kubernetes.io/service-name: payment-ledger-dual
addressType: IPv6
ports:
  - name: grpc
    protocol: TCP
    port: 8443
endpoints:
  - addresses:
      - fd00:42:7::21
    conditions:
      ready: true
    zone: zone-a
  - addresses:
      - fd00:42:8::34
    conditions:
      ready: false
    zone: zone-b
